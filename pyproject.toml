[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-kubernetes-hybrid-rag"
version = "0.1.0"
description = "Production-grade hybrid RAG for Kubernetes and SRE knowledge."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "docling>=2,<3",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pyyaml>=6,<7",
  "qdrant-client>=1.15,<2",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=5,<6",
  "transformers>=5,<6",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pre-commit>=4.2,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.12,<1.0",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sre_rag"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sre_rag"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
